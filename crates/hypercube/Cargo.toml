[package]
name = "hypercube-engine"
description = "An in-memory multidimensional analytics engine over live data"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords = ["analytics", "streaming", "linear-algebra", "hypercube"]
categories = ["data-structures", "science"]

[lib]
name = "hypercube"
path = "src/lib.rs"

[dependencies]
anyhow.workspace = true
hypercube-slice = { path = "../hypercube-slice", version = "0.1.0" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
# Keep transitive benchmark/example support within the workspace Rust 1.81 MSRV.
clap = "=4.5.32"
criterion = "0.7"
crossterm = "0.29"
tempfile = "=3.24.0"
unicode-segmentation = "=1.12.0"

[[bench]]
name = "performance"
harness = false
